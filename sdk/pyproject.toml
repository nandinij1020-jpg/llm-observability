[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observability"
version = "0.1.0"
description = "Tracing, token counting and cost attribution for AWS Bedrock agents"
requires-python = ">=3.10"
dependencies = []          # boto3 is optional: only needed for the real KinesisEmitter / Bedrock client

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[tool.setuptools]
packages = ["llm_observability"]
